<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three-way conflict annotation</title>
<style>
:root { --bg:#faf9f7; --fg:#1a1a1a; --mut:#6b6b6b; --line:#e2e0dc; --card:#fff; --acc:#2d5f8a;
        --bad:#9c3328; --good:#2f6b4f; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
.wrap { max-width:840px; margin:0 auto; padding:28px 20px 90px; }
h1 { font-size:21px; margin:0 0 6px; }
h2 { font-size:16px; margin:28px 0 10px; }
.sub { color:var(--mut); font-size:14px; margin:0 0 22px; }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:14px 0 8px; }
.bar i { display:block; height:100%; background:var(--acc); transition:width .25s; }
.meta { display:flex; justify-content:space-between; font-size:13px; color:var(--mut); margin-bottom:20px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
.stmt { border-left:3px solid var(--line); padding:2px 0 2px 14px; margin:0 0 15px; white-space:pre-wrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; line-height:1.55; }
.stmt:last-child { margin-bottom:0; }
.stmt b { display:block; font-family:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--mut); font-weight:600; margin-bottom:4px; }
.verdict { font-size:14px; margin:14px 0 0; padding:12px 14px; border-radius:8px; background:#f4f2ee; }
.verdict b.c { color:var(--bad); }
.verdict b.n { color:var(--good); }
.q { font-size:15px; margin:0 0 12px; }
.row { display:flex; gap:10px; flex-wrap:wrap; }
button { font:inherit; padding:11px 18px; border:1px solid var(--line); background:#fff; border-radius:8px;
  cursor:pointer; color:var(--fg); }
button:hover { border-color:var(--acc); }
button.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
button.sel { box-shadow:0 0 0 3px rgba(45,95,138,.28); }
button[disabled] { opacity:.4; cursor:default; }
button[disabled]:hover { border-color:var(--line); }
.row.nav { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
.prev { font-size:14px; color:var(--mut); margin:14px 0 0; }
input[type=text] { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  width:100%; max-width:320px; }
.note { font-size:13px; color:var(--mut); margin-top:16px; }
.rules { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 22px; margin-bottom:22px; }
.rules ul { margin:10px 0 0; padding-left:20px; }
.rules li { margin:6px 0; }
.warn { background:#fdf6ed; border:1px solid #e8d4b0; border-radius:10px; padding:16px 20px;
  margin-bottom:22px; font-size:15px; }
.warn b { color:#8a5a1c; }
.name { background:#eef3f8; border:1px solid #cddbe8; border-radius:10px; padding:16px 20px;
  margin-bottom:22px; font-size:15px; }
.name b { color:var(--acc); }
details.ex { background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:16px; }
details.ex > summary { cursor:pointer; padding:14px 20px; font-size:15px; color:var(--acc); list-style:none; }
details.ex > summary::-webkit-details-marker { display:none; }
details.ex > summary::before { content:"\25B8 "; }
details[open].ex > summary::before { content:"\25BE "; }
details.ex .body { padding:0 20px 8px; }
details.ex .card { box-shadow:none; }
.done { text-align:center; padding:52px 20px; }
#sync { font-size:12px; color:var(--mut); }
#sync.bad { color:var(--bad); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyuQfBKqxTaQbx3XgfBTYH3yJiIeBCFdRrfHLPz8jkm6zqqoUD0NuggyGn2vHfVtKJQ/exec";
const KEY = "debtric_annot_v3";
let DATA = [], state = { name:"", answers:{} }, idx = 0;

const EXAMPLES = [
  { v:"conflict",
    s1:"For an input of a workflow_dispatch workflow: the value of this parameter is a string specifying the data type of the input. This must be one of: boolean, choice, environment, or string.",
    s2:"This example workflow uses the inputs context to get the values of the build_id, deploy_target and perform_deploy inputs. The example is meant to be a valid workflow.",
    s3:"build_id: required: true type: number",
    why:"Each statement is fine on its own. Any two are fine together. All three cannot hold: the example is supposed to be valid, the type it declares is <i>number</i>, and <i>number</i> is not in the list of allowed types. Take away any one statement and the problem disappears." },
  { v:"conflict",
    s1:"On 18 March 2026, GitHub designated GPT-5.3-Codex as the base model.",
    s2:"The base model has a 1x premium request multiplier on paid plans.",
    s3:"GPT-5.3-Codex is available on paid plans with a 0x premium request multiplier, which means it does not consume premium requests.",
    why:"The same model cannot have both a 1x and a 0x multiplier on paid plans. You only see it once you combine all three: the first statement makes GPT-5.3-Codex <i>the base model</i>, the second gives the base model 1x, and the third gives this model 0x." },
  { v:"no_conflict",
    s1:"For an input of a workflow_dispatch workflow: the value of this parameter is a string specifying the data type of the input. This must be one of: boolean, choice, environment, or string.",
    s2:"This example workflow uses the inputs context to get the values of the build_id, deploy_target and perform_deploy inputs. The example is meant to be a valid workflow.",
    s3:"build_id: required: true type: string",
    why:"The same three statements as the first example with one word changed, <i>number</i> to <i>string</i>. Now the declared type is in the allowed list, so all three hold together and there is no conflict. One word is often all that separates the two answers, so read the detail." }
];

function clean(v) { return String(v || "").toLowerCase().replace(/[^a-z]/g, ""); }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = s; } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function answered() { return Object.keys(state.answers).length; }

async function pull(name) {
  if (!ENDPOINT.startsWith("http")) return null;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  try {
    const t = await fetch(ENDPOINT + "?annotator=" + encodeURIComponent(name) + "&callback=cb",
                          { signal:ctl.signal }).then(r => r.text());
    const a = t.indexOf("("), b = t.lastIndexOf(")");
    if (a < 0 || b <= a) return null;
    return JSON.parse(t.slice(a + 1, b));
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function post(row, tries) {
  if (!ENDPOINT.startsWith("http")) return;
  tries = tries || 0;
  fetch(ENDPOINT, { method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(row) })
    .then(r => r.text())
    .then(t => { if (t.indexOf("ok") < 0) throw new Error("bad reply"); mark(true); })
    .catch(() => {
      if (tries < 4) setTimeout(() => post(row, tries + 1), 1500 * (tries + 1));
      else mark(false);
    });
}

function mark(ok) {
  const el = document.getElementById("sync");
  if (!el) return;
  el.textContent = ok ? "saved" : "not saved yet, keep this page open";
  el.className = ok ? "" : "bad";
}
function nextUnanswered() {
  for (let i = 0; i < DATA.length; i++) if (!state.answers[DATA[i].id]) return i;
  return DATA.length;
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" })[c]); }
function answer(label) {
  const item = DATA[idx];
  const row = { annotator:state.name, id:item.id, label:label, at:new Date().toISOString() };
  state.answers[item.id] = row;
  save(); post(row);
  go(idx + 1);
}
function go(i) {
  if (i < 0) i = 0;
  if (i > DATA.length) i = DATA.length;
  idx = i;
  window.scrollTo(0, 0);
  render();
}
function download() {
  const rows = Object.values(state.answers);
  const blob = new Blob([rows.map(r => JSON.stringify(r)).join("\n")], { type:"application/x-ndjson" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "annotations_" + (state.name || "anon") + ".jsonl";
  a.click();
}
function exampleHtml(e, i) {
  const tag = e.v === "conflict"
    ? '<b class="c">Conflict</b>, the three cannot all be true'
    : '<b class="n">No conflict</b>, the three can all be true';
  return `<div class="card">
    <div class="stmt"><b>Statement 1</b>${esc(e.s1)}</div>
    <div class="stmt"><b>Statement 2</b>${esc(e.s2)}</div>
    <div class="stmt"><b>Statement 3</b>${esc(e.s3)}</div>
    <div class="verdict">Example ${i}: ${tag}.<br>${e.why}</div>
  </div>`;
}
function warnHtml() {
  return `<div class="warn">
      <b>Please do not use ChatGPT, Claude or any other AI tool to decide the answer.</b>
      The judgement has to be yours. If a statement is not clear to you, you may use an AI tool
      to understand what a word, a table or a piece of code means, and then decide yourself.
    </div>`;
}
function intro() {
  document.getElementById("app").innerHTML = `
    <h1>Three-way conflict annotation</h1>
    <p class="sub">Please read this page once before you start. It takes two minutes.</p>
    <div class="rules">
      You will see three statements at a time, taken from documents such as rules, specifications,
      guidelines, tables and code. Decide whether <b>all three can be true at the same time</b>.
      <ul>
        <li><b>Conflict</b> means no single situation makes all three true.</li>
        <li><b>No conflict</b> means at least one situation makes all three true.</li>
        <li>Treat every statement as true and use only what the statements say. Do not add outside knowledge.</li>
        <li>A conflict here needs all three. Each statement should look fine alone, and any two should look fine together.</li>
        <li>There are only two answers. If you click the wrong one, press Back and change it.</li>
      </ul>
    </div>
    ${warnHtml()}
    <div class="name">
      <b>Use your first name, in small letters, every single time.</b>
      Your progress is found by that name, so if you start on a laptop and carry on later on a phone,
      type exactly the same name and the page picks up where you stopped. A different spelling counts
      as a different person and starts from the beginning.
    </div>
    <h2>Three worked examples</h2>
    ${EXAMPLES.map((e, i) => exampleHtml(e, i + 1)).join("")}
    <div class="card">
      <p class="q">Your first name, small letters only</p>
      <input type="text" id="nm" placeholder="anna" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row" style="margin-top:14px"><button class="pri" id="go">Start annotating</button></div>
      <p class="note" id="st"></p>
    </div>`;
  const nm = document.getElementById("nm");
  nm.value = state.name || "";
  nm.oninput = () => { nm.value = clean(nm.value); };
  const start = async () => {
    const v = clean(nm.value);
    if (!v) return;
    document.getElementById("st").textContent = "looking up your progress, one moment";
    document.getElementById("go").disabled = true;
    const server = await pull(v);
    if (state.name && state.name !== v) state.answers = {};
    state.name = v;
    if (server) {
      for (const id in server) {
        if (!state.answers[id]) state.answers[id] = { annotator:v, id:id, label:server[id], at:"" };
      }
    }
    save();
    go(nextUnanswered());
  };
  document.getElementById("go").onclick = start;
  nm.onkeydown = e => { if (e.key === "Enter") start(); };
}
function render() {
  const app = document.getElementById("app");
  if (!state.name) return intro();
  const n = answered();
  if (idx >= DATA.length) {
    app.innerHTML = `<div class="done">
      <h1>${n} of ${DATA.length} answered.</h1>
      <p class="sub">Your answers were sent as you went. Please also keep a copy and send it on.</p>
      <div class="row" style="justify-content:center">
        <button class="pri" id="dl">Download my answers</button>
        <button id="bk">Go back and check</button>
      </div>
    </div>`;
    document.getElementById("dl").onclick = download;
    document.getElementById("bk").onclick = () => go(DATA.length - 1);
    return;
  }
  const it = DATA[idx];
  const prev = state.answers[it.id];
  app.innerHTML = `
    <h1>Three-way conflict annotation</h1>
    <p class="sub">${esc(state.name)} &middot; <span id="sync">ready</span></p>
    <div class="bar"><i style="width:${(n / DATA.length * 100).toFixed(1)}%"></i></div>
    <div class="meta"><span>${n} of ${DATA.length} answered</span><span>item ${idx + 1} of ${DATA.length}</span></div>
    <div class="card">
      <div class="stmt"><b>Statement 1</b>${esc(it.s1)}</div>
      <div class="stmt"><b>Statement 2</b>${esc(it.s2)}</div>
      <div class="stmt"><b>Statement 3</b>${esc(it.s3)}</div>
    </div>
    <div class="card">
      <p class="q">Can all three hold together?</p>
      <div class="row">
        <button class="pri${prev && prev.label === "conflict" ? " sel" : ""}" id="c">Conflict, they cannot</button>
        <button class="pri${prev && prev.label === "no_conflict" ? " sel" : ""}" id="n">No conflict, they can</button>
      </div>
      ${prev ? `<p class="prev">You answered <b>${prev.label === "conflict" ? "Conflict" : "No conflict"}</b>.
        Press the other button to change it.</p>` : ""}
      <div class="row nav">
        <button id="bk"${idx === 0 ? " disabled" : ""}>Back</button>
        <button id="fw"${prev ? "" : " disabled"}>Next</button>
      </div>
      <p class="note">Your place is kept if you close the page, open the same link to carry on.</p>
    </div>
    <details class="ex">
      <summary>Show the three worked examples</summary>
      <div class="body">${EXAMPLES.map((e, i) => exampleHtml(e, i + 1)).join("")}</div>
    </details>
    ${warnHtml()}`;
  document.getElementById("c").onclick = () => answer("conflict");
  document.getElementById("n").onclick = () => answer("no_conflict");
  document.getElementById("bk").onclick = () => go(idx - 1);
  document.getElementById("fw").onclick = () => go(idx + 1);
}
async function boot() {
  load();
  const app = document.getElementById("app");
  app.innerHTML = "<h1>Three-way conflict annotation</h1><p class='sub'>Loading, one moment.</p>";
  try {
    DATA = await fetch("samples.json").then(r => r.json());
  } catch (e) {
    app.innerHTML = "<h1>Could not load samples.json</h1><p class='sub'>The data file is missing next to this page.</p>";
    return;
  }
  if (state.name) {
    const server = await pull(state.name);
    if (server) {
      for (const id in server) {
        if (!state.answers[id]) state.answers[id] = { annotator:state.name, id:id, label:server[id], at:"" };
      }
      save();
    }
  }
  go(nextUnanswered());
}
boot();
</script>
</body>
</html>
